<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secret Password</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #ffe6eb;
  font-family: 'Fredoka', sans-serif;
  padding: 15px;
  box-sizing: border-box;
  overflow: hidden; /* Pinigilan ang scroll ng buong page */
}
.container {
  background: white;
  padding: 20px;
  border-radius: 20px;
  text-align: center;
  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
  width: 320px; /* Saktong sukat para sa portrait phone screen */
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  align-items: center;
}
h1 { color: #ff4d6d; font-size: 22px; margin: 0 0 5px 0; }
p { color: #ff758f; font-size: 14px; margin: 0 0 10px 0; }
#display { font-size: 22px; font-weight: 600; color: #ff4d6d; letter-spacing: 2px; margin: 5px 0; }

.keypad {
  display: grid;
  grid-template-columns: repeat(3, 65px);
  gap: 8px;
  justify-content: center;
  margin-top: 5px;
}
.keypad button {
  width: 65px;
  height: 50px; /* Ginawang mas maikli ang taas para tipid sa space */
  font-size: 18px;
  font-family: 'Fredoka', sans-serif;
  border-radius: 12px;
  border: none;
  background: #ffb6c1;
  color: #fff;
  font-weight: 600;
  cursor: pointer;
  transition: 0.2s;
}
.keypad button:hover {
  background: #ff4d6d;
}

#message { 
  margin-top: 10px;
  min-height: 125px; /* Naka-reserve na ang space para hindi umuga ang layout pag lumabas si Bubu */
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}
#message img { width: 100px; height: auto; display: block; }
#message p { color: #ff4d6d; font-size: 15px; margin-top: 5px; font-weight: 500; }

/* Back Button Style */
.back-btn {
  margin-top: 10px;
  padding: 8px 20px;
  background-color: #ffb3c1;
  color: #ff4d6d;
  border: none;
  border-radius: 12px;
  cursor: pointer;
  font-size: 14px;
  font-family: 'Fredoka', sans-serif;
  font-weight: 500;
  box-shadow: 0 4px 10px rgba(255, 179, 193, 0.2);
  transition: .3s;
}
.back-btn:hover {
  transform: scale(1.05);
  background-color: #ffccd5;
}
</style>
</head>
<body>

<div class="container">
  <h1>🔐 Secret Password 🔐</h1>
  <p>💖 What's the date when Bubu officially became yours?</p>
  <p id="display">______</p>
  
  <div class="keypad">
    <button onclick="press('1')">1</button>
    <button onclick="press('2')">2</button>
    <button onclick="press('3')">3</button>
    <button onclick="press('4')">4</button>
    <button onclick="press('5')">5</button>
    <button onclick="press('6')">6</button>
    <button onclick="press('7')">7</button>
    <button onclick="press('8')">8</button>
    <button onclick="press('9')">9</button>
    <button onclick="clearPin()" style="background:#ccc;">C</button>
    <button onclick="press('0')">0</button>
    <button onclick="checkPassword()" style="background:#ff4d6d;">OK</button>
  </div>
  
  <div id="message"></div>
  
  <button class="back-btn" onclick="window.location.href='index.html'">◀ Back</button>
</div>

<script>
  let pin = "";
  function press(num) {
    if (pin.length < 6) {
      pin += num;
      document.getElementById("display").innerText = pin;
    }
  }
  function clearPin() {
    pin = "";
    document.getElementById("display").innerText = "______";
  }
  function checkPassword() {
    if (pin === "041426") {
      document.getElementById("message").innerHTML = `
        <img src="Happy Bubu.gif">
        <p>💖 Aww you remembered! 🥺</p>
      `;
      setTimeout(() => {
        window.location.href = "ready.html";
      }, 2000);
    } else {
      document.getElementById("message").innerHTML = `
        <img src="Mad Bubu.jpg">
        <p>Wrong, Dudu! Try again! 😒😒</p>
      `;
      setTimeout(() => { clearPin(); }, 1500);
    }
  }
</script>
</body>
</html>
