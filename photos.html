<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Love Gallery 📸</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #ffe6eb;
            font-family: 'Fredoka', sans-serif;
            padding: 20px;
            box-sizing: border-box;
        }

        h1 {
            color: #ff4d6d;
            margin: 10px 0 5px 0;
            font-size: 28px;
        }

        .subtitle {
            color: #ff758f;
            margin: 0 0 25px 0;
            font-size: 16px;
        }

        /* Container ng Gallery - Naka-center ang dalawang litrato */
        .gallery-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 25px;
            width: 100%;
            max-width: 600px;
            padding: 10px;
            box-sizing: border-box;
            margin-bottom: 35px;
        }

        /* Polaroid Frame Style */
        .polaroid {
            background: white;
            padding: 12px 12px 25px 12px;
            border-radius: 4px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
            text-align: center;
            width: 170px; /* Sakto ang laki para sa dalawang litrato */
            box-sizing: border-box;
        }

        /* Katamtamang pagka-tabingi ng dalawang litrato */
        .polaroid:nth-child(1) {
            transform: rotate(-3deg);
        }
        .polaroid:nth-child(2) {
            transform: rotate(3deg);
        }

        .polaroid:hover {
            transform: scale(1.05) rotate(0deg);
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
            z-index: 5;
        }

        /* Ang mismong imahe sa loob ng polaroid */
        .polaroid img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 2px;
            background-color: #f5f5f5;
        }

        /* Caption o sulat sa ilalim */
        .caption {
            margin-top: 12px;
            color: #ff4d6d;
            font-size: 14px;
            font-weight: 500;
            line-height: 1.3;
        }

        /* --- LIGHTBOX (PANG ZOOM-IN NG PICTURE) --- */
        .lightbox {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 100;
            justify-content: center;
            align-items: center;
            cursor: zoom-out;
        }

        .lightbox img {
            max-width: 90%;
            max-height: 80%;
            border: 8px solid white;
            border-radius: 4px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.5);
            transform: scale(0.9);
            transition: transform 0.3s ease;
        }

        .lightbox.show {
            display: flex;
        }

        .lightbox.show img {
            transform: scale(1);
        }

        /* Back Button Style */
        .back-btn {
            padding: 10px 25px;
            background-color: #ffb3c1;
            color: #ff4d6d;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 15px;
            font-family: 'Fredoka', sans-serif;
            font-weight: 500;
            box-shadow: 0 4px 10px rgba(255, 179, 193, 0.2);
            transition: .3s;
        }

        .back-btn:hover {
            transform: scale(1.05);
            background-color: #ffccd5;
        }
    </style>
</head>
<body>

    <h1>📸 Our Memory Lane</h1>
    <div class="subtitle">Tap the picture to zoom image</div>

    <div class="gallery-container">
        
        <div class="polaroid" onclick="zoomImage(this)">
            <img src="webcam.jpg" alt="Memory 1">
            <div class="caption">Pics sa malinaw na webcam HAHAHAHA eme</div>
        </div>

        <div class="polaroid" onclick="zoomImage(this)">
            <img src="crop.jpg" alt="Memory 2">
            <div class="caption">Cropped sa instant ni maem Alia HAHAHAHA</div>
        </div>

    </div>

    <button class="back-btn" onclick="location.href='home.html'">◀ Back</button>

    <div id="lightbox" class="lightbox" onclick="closeZoom()">
        <img id="lightbox-img" src="" alt="Zoomed Memory">
    </div>

    <script>
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');

        function zoomImage(polaroidElement) {
            const imgSrc = polaroidElement.querySelector('img').src;
            lightboxImg.src = imgSrc;
            lightbox.classList.add('show');
        }

        function closeZoom() {
            lightbox.classList.remove('show');
        }
    </script>
</body>
</html>
