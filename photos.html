<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Love Gallery 📸</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #ffe6eb;
            font-family: 'Fredoka', sans-serif;
            padding: 20px;
            box-sizing: border-box;
        }

        h1 {
            color: #ff4d6d;
            margin: 10px 0 5px 0;
            font-size: 32px; /* Bahagyang pinalaki para sa malaking screen */
        }

        .subtitle {
            color: #ff758f;
            margin: 0 0 30px 0;
            font-size: 18px;
        }

        /* Container ng Gallery - Responsive Grid */
        .gallery-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); /* Dynamic width para sa desktop */
            gap: 30px; /* Mas malaking space sa pagitan */
            width: 100%;
            max-width: 1200px; /* Pinalapad ang maximum width para sa laptop/desktop */
            padding: 10px;
            box-sizing: border-box;
            margin-bottom: 40px;
            justify-items: center; /* Naka-center ang mga polaroid sa grid nila */
        }

        /* Polaroid Frame Style - responsive size */
        .polaroid {
            background: white;
            padding: 15px 15px 30px 15px; /* Dinagdagan ang padding */
            border-radius: 6px; /* Bahagyang mas rounded */
            box-shadow: 0 6px 20px rgba(0,0,0,0.12);
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
            text-align: center;
            width: 100%; /* Gamitin ang buong luwang ng grid cell */
            max-width: 500px; /* Pero huwag masyadong lumaki kapag iisa lang */
            box-sizing: border-box;
        }

        /* Katamtamang pagka-tabingi */
        .polaroid:nth-child(1) {
            transform: rotate(-2deg);
        }
        .polaroid:nth-child(2) {
            transform: rotate(2deg);
        }

        .polaroid:hover {
            transform: scale(1.03) rotate(0deg);
            box-shadow: 0 10px 30px rgba(0,0,0,0.18);
            z-index: 5;
        }

        /* Ang mismong imahe sa loob ng polaroid - Responsive Size */
        .polaroid img {
            width: 100%;
            height: 350px; /* Mas mataas para sa laptop view */
            object-fit: cover; /* Pinapanatili ang aspect ratio habang nagka-crop */
            border-radius: 4px;
            background-color: #f5f5f5;
        }

        /* Caption o sulat sa ilalim */
        .caption {
            margin-top: 15px;
            color: #ff4d6d;
            font-size: 16px; /* Bahagyang pinalaki ang font */
            font-weight: 500;
            line-height: 1.4;
        }

        /* --- LIGHTBOX (PANG ZOOM-IN NG PICTURE) --- */
        .lightbox {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85); /* Mas madilim na background */
            z-index: 100;
            justify-content: center;
            align-items: center;
            cursor: zoom-out;
        }

        .lightbox img {
            max-width: 95%; /* Mas malaking zoom view */
            max-height: 90%;
            border: 10px solid white; /* Mas makapal na border sa zoom */
            border-radius: 4px;
            box-shadow: 0 5px 30px rgba(0,0,0,0.6);
            transform: scale(0.9);
            transition: transform 0.3s ease;
        }

        .lightbox.show {
            display: flex;
        }

        .lightbox.show img {
            transform: scale(1);
        }

        /* Back Button Style */
        .back-btn {
            padding: 12px 30px;
            background-color: #ffb3c1;
            color: #ff4d6d;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            font-size: 16px;
            font-family: 'Fredoka', sans-serif;
            font-weight: 500;
            box-shadow: 0 5px 15px rgba(255, 179, 193, 0.25);
            transition: .3s;
        }

        .back-btn:hover {
            transform: scale(1.05);
            background-color: #ffccd5;
        }

        /* --- MOBILE ADJUSTMENTS (Kung sa phone binuksan) --- */
        @media (max-width: 600px) {
            h1 { font-size: 26px; }
            .subtitle { font-size: 15px; }
            
            .gallery-container {
                grid-template-columns: 1fr; /* Isa-isa na lang sa phone screen */
                gap: 20px;
                padding: 5px;
            }

            .polaroid {
                width: 85%; /* Huwag sakupin ang buong width ng phone */
                max-width: 320px;
                padding: 10px 10px 20px 10px;
            }
            
            .polaroid img {
                height: 250px; /* Mas maikli sa phone view para hindi ma-scroll */
            }

            .caption {
                font-size: 14px;
                margin-top: 10px;
            }
        }
    </style>
</head>
<body>

    <h1>🤍 Us 🤍</h1>
    <div class="subtitle">Tap the picture to zoom image</div>

    <div class="gallery-container">
        
        <div class="polaroid" onclick="zoomImage(this)">
            <img src="webcam.jpg" alt="Memory 1">
            <div class="caption">Pics sa malinaw na webcam HAHAHAHA eme</div>
        </div>

        <div class="polaroid" onclick="zoomImage(this)">
            <img src="crop.jpg" alt="Memory 2">
            <div class="caption">Cropped sa instant ni maem Alia HAHAHAHA</div>
        </div>

    </div>

    <button class="back-btn" onclick="location.href='home.html'">◀ Back</button>

    <div id="lightbox" class="lightbox" onclick="closeZoom()">
        <img id="lightbox-img" src="" alt="Zoomed Memory">
    </div>

    <script>
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');

        function zoomImage(polaroidElement) {
            const imgSrc = polaroidElement.querySelector('img').src;
            lightboxImg.src = imgSrc;
            lightbox.classList.add('show');
        }

        function closeZoom() {
            lightbox.classList.remove('show');
        }
    </script>
</body>
</html>
