<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
<title>Welcome Page</title>

<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4);
    font-family: 'Fredoka', sans-serif;
  }
  
  .top-image {
    width: 180px;
    max-width: 80%;
    height: auto;
    margin-bottom: 20px;
  }
  
  .container {
    text-align: center;
    background: white;
    padding: 30px;
    border-radius: 10px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
  }
  
  h1 {
    color: #ff4d6d;
  }
  
  button {
    padding: 12px 25px;
    font-size: 16px;
    border: none;
    border-radius: 10px;
    background: #ff4d6d;
    color: white;
    cursor: pointer;
  }
  
  button:hover {
    background: #ff1e4d;
  }
</style>

</head>
<body>
  
  <div class="container">
    <img src="Bubu Welcome.jpg" class="top-image">
    
    <h1>Happy Monthsary, Dudu! 🤍</h1>
    <h2>I'm Happy you're here!</h2>
  </div>
  
  <div class="button-container" style="margin-top: 30px;">
  <button onclick="window.location.href='password.html'">
    Click to Proceed
  </button>
</div>

</body>
</html>
