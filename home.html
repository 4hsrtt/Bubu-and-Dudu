<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bubu's Gift Box</title>

<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background-color:#ffe6eb;
  font-family:'Fredoka',sans-serif;
  position: relative;
  overflow-x: hidden; /* Para hindi magka-scroll sa phone dahil sa background images */
}

/* --- MGA BACKGROUND POLAROID PICTURE DESIGNS --- */
/* Ito ang magsisilbing wrapper para sa mga nakakalat na litrato */
body::before, body::after, .bg-photo-3, .bg-photo-4 {
  content: "";
  position: absolute;
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  border: 6px solid white; /* Polaroid Frame */
  box-shadow: 0 4px 15px rgba(0,0,0,0.1);
  border-radius: 6px;
  z-index: 0; /* Nasa pinakalikod para hindi harangan ang buttons */
  width: 130px;
  height: 130px;
  opacity: 0.8; /* Medyo fade para lumitaw ang menu sa gitna */
  pointer-events: none; /* Para hindi ma-click nang mali */
}

/* Background Photo 1 (Itaas-Kaliwa) */
body::before {
  top: 50px;
  left: 60px;
  transform: rotate(-10deg);
  /* PALITAN ITO NG SELECTION MO: */
  background-image: url('budu1.jpg'); 
}

/* Background Photo 2 (Ibabang-Kaliwa) */
body::after {
  bottom: 50px;
  left: 60px;
  transform: rotate(8deg);
  /* PALITAN ITO NG SELECTION MO: */
  background-image: url('budu2.jpg');
}

/* Background Photo 3 (Itaas-Kanan) */
.bg-photo-3 {
  top: 50px;
  right: 60px;
  transform: rotate(12deg);
  /* PALITAN ITO NG SELECTION MO: */
  background-image: url('cute.jpg');
}

/* Background Photo 4 (Ibabang-Kanan) */
.bg-photo-4 {
  bottom: 50px;
  right: 60px;
  transform: rotate(-7deg);
  /* PALITAN ITO NG SELECTION MO: */
  background-image: url('budu3.jpg');
}

/* --- MAIN MENU INTERFACE --- */
.container{
  text-align:center;
  padding: 50px;
  width: 100%;
  box-sizing: border-box;
  z-index: 1; /* Sinisiguradong nasa ibabaw ng background pics ang menu niyo */
}

h1{
  color:#ff4d6d;
  margin-bottom: 40px;
  text-shadow: 0 2px 5px rgba(255,255,255,0.8);
}

.menu{
  display: flex;
  flex-direction: row;
  justify-content: center;
  align-items: center;
  gap: 25px;
  flex-wrap: wrap;
}

.icon{
  background: rgba(255, 255, 255, 0.95); /* May konting aninag para mas maganda tingnan sa ibabaw ng bg */
  padding:25px 20px;
  border-radius:24px;
  cursor:pointer;
  box-shadow:0 6px 15px rgba(0,0,0,.08);
  transition:.3s ease;
  width: 120px;
  box-sizing: border-box;
}

.icon:hover{
  transform:scale(1.08) translateY(-5px);
  box-shadow:0 10px 20px rgba(255, 77, 109, .2);
}

.emoji{
  font-size:45px;
}

.label{
  margin-top:12px;
  color:#ff4d6d;
  font-size:16px;
  font-weight: 500;
}

/* Responsive Guide: Para sa maliliit na screen ng phone */
@media (max-width: 600px) {
  /* Pinapaliit ang background photos para hindi mapuno ang screen ng phone */
  body::before, body::after, .bg-photo-3, .bg-photo-4 {
    width: 90px;
    height: 90px;
  }
  body::before { top: 15px; left: 10px; }
  body::after { bottom: 15px; left: 15px; }
  .bg-photo-3 { top: 15px; right: 15px; }
  .bg-photo-4 { bottom: 15px; right: 10px; }
  
  h1 { margin-bottom: 25px; font-size: 24px; }
}
/* Universal Back Button Style */
.back-btn {
  margin-top: 20px;
  padding: 10px 20px;
  background-color: #ffb3c1;
  color: #ff4d6d;
  border: none;
  border-radius: 12px;
  cursor: pointer;
  font-size: 15px;
  font-family: 'Fredoka', sans-serif;
  font-weight: 500;
  box-shadow: 0 4px 10px rgba(255, 179, 193, 0.2);
  transition: .3s;
}

.back-btn:hover {
  transform: scale(1.05);
  background-color: #ffccd5;
}
</style>
</head>

<body>

<div class="bg-photo-3"></div>
<div class="bg-photo-4"></div>

<div class="container">

  <h1>💖 Bubu's Gift Box 💖</h1>

  <div class="menu">

    <div class="icon" onclick="location.href='letter.html'">
      <div class="emoji">📩</div>
      <div class="label">Letter</div>
    </div>

    <div class="icon" onclick="location.href='photos.html'">
      <div class="emoji">📸</div>
      <div class="label">Photos</div>
    </div>

    <div class="icon" onclick="location.href='puzzle.html'">
      <div class="emoji">🧩</div>
      <div class="label">Puzzle</div>
    </div>

  </div>
<button class="back-btn" onclick="window.location.href='index.html'">◀ Back</button>
</div>

</body>
</html>
